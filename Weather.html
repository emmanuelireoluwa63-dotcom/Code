<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Weather App</title>
  
  <style>
    /* 1. Background Pattern */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e5e5f7;
      background-image: radial-gradient(#448ce8 0.75px, transparent 0.75px), radial-gradient(#448ce8 0.75px, #e5e5f7 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    /* 2. Weather Card Styling */
    .weather-card {
      position: relative;
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      color: #ffffff;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    /* 3. Floating Icon Animation */
    .weather-icon {
      font-size: 50px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    .current-weather h1 {
      margin: 10px 0 5px;
      font-size: 28px;
    }

    .temp {
      font-size: 48px;
      font-weight: bold;
      margin: 0;
    }

    .condition {
      font-style: italic;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .forecast h3 {
      font-size: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .day {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <div class="weather-icon">☀️</div>

    <div class="current-weather">
      <h1>Lagos</h1>
      <p class="temp">28°C</p>
      <p class="condition">Sunny & Warm</p>
    </div>

    <div class="forecast">
      <h3>Weekly Forecast</h3>
      <div class="forecast-days">
        <div class="day"><span>Mon</span> <span>☀️ 29°C</span></div>
        <div class="day"><span>Tue</span> <span>⛅ 27°C</span></div>
        <div class="day"><span>Wed</span> <span>🌧️ 24°C</span></div>
        <div class="day"><span>Thu</span> <span>⛈️ 23°C</span></div>
        <div class="day"><span>Fri</span> <span>🌤️ 26°C</span></div>
      </div>
    </div>
  </div>

</body>
</html>
